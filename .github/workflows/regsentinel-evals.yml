name: regsentinel-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evals]"
      - name: Ruff (lint)
        run: ruff check src tests evals
      - name: Ruff (format check)
        run: ruff format --check src tests evals
      - name: Mypy
        run: mypy src

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evals]"
      - name: Bandit (SAST)
        run: bandit -q -r src
      - name: pip-audit (dependency CVEs)
        # Advisory: surfaces upstream CVEs without blocking merges on
        # vulnerabilities we cannot immediately fix.
        continue-on-error: true
        run: pip-audit

  test:
    name: tests + evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evals]"

      # Deterministic tests + scorers, with a coverage floor.
      - name: Run tests
        run: pytest -q --cov=regsentinel --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      # Deterministic eval layers — no API key required.
      - name: Run unit evals
        run: python -m evals.run_unit_evals
      - name: Run guardrail evals
        run: python -m evals.run_guardrail_evals

      # Model-driven layers — only when the key secret is configured. They skip
      # cleanly (exit 0) otherwise, so forked PRs without the secret stay green.
      - name: Run agent evals
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m evals.run_agent_evals
      - name: Run end-to-end evals
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m evals.run_end_to_end_evals

      - name: Summarize
        if: always()
        run: python -m evals.summarize
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: eval-results
          path: evals/results/
