name: Bug report
description: Report a defect in RegSentinel
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Command(s) run, regulations/working dir used, and any relevant config.
      placeholder: |
        1. regsentinel "GDPR Article 30" sample_data
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant log lines or the audit trail (redact any secrets).
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `pip show regsentinel` or the git commit SHA.
    validations:
      required: true
